[project]
name = "nittaq-auditor"
version = "1.0.0"
description = "مدقق نطاق — safety-first tracking auditor skill for Salla stores"
requires-python = ">=3.10"
dependencies = []  # runtime is stdlib-only

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["ruff", "mypy"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".nittaq"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/fake_store.py" = ["UP031"]

[tool.mypy]
python_version = "3.10"
files = ["core", "validators", "adapters", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
